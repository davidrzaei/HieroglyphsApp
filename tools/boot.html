<!-- Startskærmen, mens ordbogen hentes og åbnes: midt på skærmen, et ankh-tegn, en tydelig bjælke med procent, og en løbende bjælke i trinene uden procent. Den ses kun, hvis splashskærmen er væk (fejl og "Try again"). Tastaturet holdes skjult, til appen er klar. -->
<style>
.booting .kbd{visibility:hidden}
#bresults:has(.boot){justify-content:center}
.boot{flex:1;justify-content:center;align-items:center;text-align:center;gap:14px;padding:24px 10px 40px}
.boot::before{content:"\132F9";font-family:var(--glyph);font-size:4.2rem;line-height:1;color:var(--lapis);-webkit-text-stroke:.02em currentColor;margin-bottom:6px}
.boot .eyebrow{margin:0}
.boot .banner{width:100%;max-width:320px;display:flex;flex-direction:column;gap:8px;border:0;background:none;padding:0;color:var(--ink);font-size:.92rem}
.boot .banner b{font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1.25}
.boot .bt{order:3;text-align:left;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.4em}
.boot .bar{order:2;display:block;position:relative;height:8px;margin:6px 0 0;border-radius:999px;background:var(--line);overflow:visible}
.boot .bar i{height:100%;border-radius:999px;background:var(--lapis);min-width:8px}
.boot .bar::after{content:attr(aria-valuenow) "%";position:absolute;right:0;top:calc(100% + 8px);font-size:.92rem;font-weight:600;color:var(--lapis);font-variant-numeric:tabular-nums}
/* trin uden procent: en kort bjælke, der løber frem og tilbage */
.boot .banner.info:not(:has(.bar))::after{content:"";order:2;position:static;display:block;width:100%;height:8px;margin-top:6px;border:0;border-radius:999px;opacity:1;transform:none;
  background:linear-gradient(90deg,transparent 0 35%,var(--lapis) 35% 65%,transparent 65%) 0 0/250% 100% no-repeat,var(--line);animation:bootrun 1.3s ease-in-out infinite}
@keyframes bootrun{0%{background-position:100% 0,0 0}100%{background-position:0 0,0 0}}
@media (prefers-reduced-motion: reduce){.boot .banner.info:not(:has(.bar))::after{animation:none;background:var(--line)}}
.boot>.note{max-width:30ch;font-size:.82rem}
.boot .banner.err{max-width:320px;border:1px solid var(--err-line);background:var(--err-soft);color:var(--err);padding:10px 12px;border-radius:10px;font-size:.9rem}
.boot .primary{align-self:center;padding:10px 22px}
</style>
<script>
(function () {
  /* Mens ordbogen åbnes, har siden klassen booting, og splashskærmen dækker appen. Den viser kun en kort status; når ordbogen
     hentes første gang, også hvor langt den er. Er appen klar, glider splashskærmen væk, og hændelsen app-ready sendes
     (nyhedsvinduet venter på den). Går noget galt, fjernes splashskærmen, så fejlen og "Try again" kan ses. */
  const root = document.documentElement, splash = document.getElementById('splash');
  const B = () => window.__boot;
  const hide = () => { if (!splash || splash.classList.contains('gone')) return; splash.classList.add('gone'); setTimeout(() => { splash.hidden = true; }, 400); };
  const show = () => { if (!splash) return; splash.hidden = false; void splash.offsetWidth; splash.classList.remove('gone'); };
  if (!B() || B().phase === 'ready') { hide(); window.__appReady = true; return; }
  root.classList.add('booting');
  const st = splash && splash.querySelector('.st'), bar = splash && splash.querySelector('.sbar'), fill = bar && bar.querySelector('i');
  /* En almindelig start viser kun ikon og navn. Hentes ordbogen (første gang eller efter en ny database), vises hvor langt den er.
     Tager starten usædvanligt lang tid, kommer en lille løbende bjælke frem, så appen ikke ser ud til at stå stille. */
  let slow = false; setTimeout(() => { slow = true; mirror(); }, 4000);
  function mirror() {
    if (!splash) return;
    const boot = document.querySelector('#bresults .boot'), title = boot && boot.querySelector('.banner b'), pb = boot && boot.querySelector('.bar');
    const t = title ? title.textContent : '', download = !!pb && /download/i.test(t), fetching = download || /unpack|check/i.test(t);
    const pct = pb ? Number(pb.getAttribute('aria-valuenow')) || 0 : 0;
    st.textContent = download ? 'Downloading the dictionary · ' + pct + '%' : fetching ? t : '';
    bar.hidden = !(fetching || slow);
    bar.classList.toggle('det', download);
    fill.style.width = download ? pct + '%' : '';
  }
  const res = document.getElementById('bresults');
  if (res) new MutationObserver(mirror).observe(res, { childList: true, subtree: true, attributes: true, attributeFilter: ['aria-valuenow'] });
  mirror();
  let last = B().phase;
  const t = setInterval(() => {
    const ph = B() ? B().phase : 'ready';
    if (ph === 'error' && last !== 'error') hide();      /* tastaturet forbliver skjult, til appen er klar */
    if (ph === 'loading' && last === 'error') { show(); mirror(); }      /* "Try again" */
    last = ph;
    if (ph !== 'ready') return;
    clearInterval(t); root.classList.remove('booting'); hide();
    window.__appReady = true; window.dispatchEvent(new Event('app-ready'));
  }, 100);
})();
</script>
