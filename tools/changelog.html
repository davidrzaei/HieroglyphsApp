<!-- Nyheder: første gang appen åbnes efter en opdatering, vises de punkter i changelog.json, man ikke har set. -->
<style>
.news{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));background:var(--scrim)}
.news[hidden]{display:none}
.newscard{width:100%;max-width:380px;max-height:100%;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.3);overflow:hidden}
.newscard>h2{padding:16px 18px 10px;font-size:1.3rem}
.newsbody{overflow-y:auto;padding:0 18px 6px;display:flex;flex-direction:column;gap:14px}
.newsbody section{display:flex;flex-direction:column;gap:4px}
.newsbody h3{font-family:var(--body);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.newsbody ul{font-size:.95rem;display:flex;flex-direction:column;gap:4px}
.newscard>.primary{margin:12px 18px 18px;padding:11px 14px;font-size:1rem}
</style>
<div class="news" id="news" role="dialog" aria-modal="true" aria-labelledby="newstitle" hidden>
  <div class="newscard">
    <h2 id="newstitle">What's new</h2>
    <div class="newsbody" id="newsbody"></div>
    <button type="button" class="primary" id="newsok">OK</button>
  </div>
</div>
<script>
(function () {
  const LOG = /*CHANGELOG*/[];
  const SEEN = 'hiero-news-seen', STORE = 'hiero-proto-v1';
  if (!LOG.length) return;
  const latest = LOG[0].version;
  let seen = null, used = false;
  try { seen = localStorage.getItem(SEEN); used = !!localStorage.getItem(STORE); } catch (e) { return; }
  const mark = () => { try { localStorage.setItem(SEEN, latest); } catch (e) {} };
  /* Ny bruger: intet at vise. Bruger fra før nyhederne fandtes: kun den seneste udgave. */
  const fresh = seen ? LOG.filter(e => e.version > seen) : (used ? LOG.slice(0, 1) : []);
  if (!fresh.length) { mark(); return; }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const date = v => { const d = new Date(v + 'T12:00:00'); return isNaN(d) ? v : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }); };
  document.getElementById('newsbody').innerHTML = fresh.map(e =>
    '<section><h3>' + esc(date(e.version)) + (e.title ? ' · ' + esc(e.title) : '') + '</h3><ul>' + e.items.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul></section>').join('');
  const box = document.getElementById('news'), ok = document.getElementById('newsok');
  const close = () => { box.hidden = true; mark(); };
  ok.addEventListener('click', close);
  box.addEventListener('click', e => { if (e.target === box) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !box.hidden) close(); });
  box.hidden = false; ok.focus();
})();
</script>
